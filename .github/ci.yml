# Name for your GitHub Actions workflow
name: CI/CD Pipeline

# --- Triggers ---
# This workflow will run on:
# 1. Any 'push' event (like a git push) to the 'main' branch
# 2. Any 'pull_request' event that targets the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# --- Jobs ---
# A workflow is made of one or more jobs.
jobs:
  # This job is named 'build-and-test'
  build-and-test:
    # It will run on a virtual machine hosted by GitHub (Ubuntu is the standard)
    runs-on: ubuntu-latest

    # --- Steps ---
    # These are the actual commands the job will run
    steps:
      # --- 1. Checkout Code ---
      # Uses an official 'action' to download your repository's code
      # into the virtual machine.
      - name: Check out code
        uses: actions/checkout@v4

      # --- 2. Set up Python ---
      # Uses the official 'setup-python' action to install Python 3.10.
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- 3. Install Dependencies ---
      # Runs command-line 'pip' commands to install all packages
      # from your requirements.txt file.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # We also install this package to create a test report
          pip install pytest-junitxml

      # --- 4. Run Linter (flake8) ---
      # Runs the 'flake8' command. If flake8 finds any style errors,
      # it will exit with an error, which fails this step and the build.
      - name: Lint with flake8
        run: flake8 .

      # --- 5. Run Tests and Produce Results ---
      # Runs 'pytest' (as a module) and tells it to create a test
      # report in the 'test-results.xml' file (JUnit format).
      - name: Run tests and generate report
        run: python -m pytest --junitxml=test-results.xml

      # --- 6. Upload Test Results Artifact ---
      # This step takes the 'test-results.xml' file generated above
      # and uploads it as an 'artifact' to the GitHub Actions run.
      # 'if: always()' ensures this runs even if the tests fail,
      # so you can still see the report of which tests failed.
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

      # --- 7. Set up Docker Buildx ---
      # This is a required setup step for building Docker images
      # efficiently within GitHub Actions.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 8. Build Docker image ---
      # Runs the 'docker build' command, using your Dockerfile
      # and tags the image as 'my-app:latest'.
      # (Note: This assumes your Dockerfile is in the root)
      - name: Build Docker image
        run: |
          docker build . --tag my-app:latest

      # --- 9. Save and Upload Docker Image Artifact ---
      # This meets the requirement to "upload the image artifact".
      # We save the built image as a .tar file, then upload that .tar
      # file as a workflow artifact.
      - name: Save Docker image as artifact
        run: |
          docker save my-app:latest -o iris-app-image.tar
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: iris-app-image.tar